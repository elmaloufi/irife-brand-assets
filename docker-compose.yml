services:
  postgres:
    image: postgres:18-alpine
    container_name: irife-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: irife
      POSTGRES_PASSWORD: irife_local_dev_only
      POSTGRES_DB: irife
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - irife_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irife -d irife"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  irife_postgres_data:
