name: ESLint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 4 * * 4'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  eslint:
    name: Run ESLint static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ESLint tooling
        run: |
          npm install --no-save --no-package-lock eslint@8.57.1 @typescript-eslint/parser@8.70.0 @microsoft/eslint-formatter-sarif@3.1.0

      - name: Run ESLint
        id: eslint
        continue-on-error: true
        env:
          SARIF_ESLINT_IGNORE_SUPPRESSED: "true"
        run: |
          npx eslint . \
            --config .eslintrc.cjs \
            --ext .js,.jsx,.ts,.tsx \
            --format @microsoft/eslint-formatter-sarif \
            --output-file eslint-results.sarif

      - name: Upload analysis results to GitHub
        if: always() && hashFiles('eslint-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@5eb3ed6614230b1931d5c08df9e096e4ba524f21 # v3.28.17
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true

      - name: Report lint result
        if: always()
        shell: bash
        run: |
          echo "## ESLint" >> "$GITHUB_STEP_SUMMARY"
          echo "- ESLint step result: ${{ steps.eslint.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.eslint.outcome }}" = "failure" ]; then
            echo "::error::ESLint reported errors. See the uploaded SARIF report and job logs."
            exit 1
          fi
