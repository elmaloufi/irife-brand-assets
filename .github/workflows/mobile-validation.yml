name: Mobile validation

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'security/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Expo prebuild and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Expo SDK dependency compatibility
        id: expo_compatibility
        continue-on-error: true
        working-directory: apps/mobile
        run: npx expo install --check

      - name: Generate Android native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Export Android JavaScript bundle and assets
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/irife-android-export"

      - name: Enforce Expo SDK dependency compatibility
        if: always()
        env:
          EXPO_COMPATIBILITY_OUTCOME: ${{ steps.expo_compatibility.outcome }}
        run: |
          if [[ "$EXPO_COMPATIBILITY_OUTCOME" != "success" ]]; then
            echo "::error::Expo SDK dependency versions are out of sync; see the compatibility report above."
            exit 1
          fi
