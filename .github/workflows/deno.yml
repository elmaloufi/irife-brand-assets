# This workflow runs only when a root Deno project configuration is present.
name: Deno

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect Deno project
        id: deno_project
        shell: bash
        run: |
          if [ -f deno.json ] || [ -f deno.jsonc ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deno checks skipped: no root deno.json or deno.jsonc is present."
          fi

      - name: Setup Deno
        if: steps.deno_project.outputs.available == 'true'
        uses: denoland/setup-deno@61fe2df320078202e33d7d5ad347e7dcfa0e8f31 # v1.1.2
        with:
          deno-version: v2.x

      - name: Run linter
        if: steps.deno_project.outputs.available == 'true'
        run: deno lint

      - name: Run tests
        if: steps.deno_project.outputs.available == 'true'
        run: deno test -A

      - name: Deno status summary
        if: always()
        shell: bash
        run: |
          echo "## Deno checks" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.deno_project.outputs.available }}" = "true" ]; then
            echo "- Result: Deno lint and tests were run; inspect the step results above." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Result: SKIPPED - this repository does not currently declare a root Deno project." >> "$GITHUB_STEP_SUMMARY"
          fi
