# GitHub CodeQL scans the repository's workflow and TypeScript/JavaScript code.
name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "45 2 * * 1"

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ["actions", "javascript-typescript"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

      - name: Inspect open CodeQL alerts for this pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.codeScanning.listAlertsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              ref: `refs/heads/${context.payload.pull_request.head.ref}`,
              tool_name: 'CodeQL',
              per_page: 100,
            });
            const alerts = data.map((alert) => ({
              number: alert.number,
              rule: alert.rule.id,
              severity: alert.rule.security_severity_level,
              message: alert.most_recent_instance?.message?.text,
              path: alert.most_recent_instance?.location?.path,
              start_line: alert.most_recent_instance?.location?.start_line,
              html_url: alert.html_url,
            }));
            core.info('Open CodeQL alerts for PR head branch:');
            core.info(JSON.stringify(alerts, null, 2));
            const all = await github.rest.codeScanning.listAlertsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              tool_name: 'CodeQL',
              per_page: 100,
            });
            core.info('All open CodeQL alerts in repository:');
            core.info(JSON.stringify(all.data.map((alert) => ({ number: alert.number, rule: alert.rule.id, severity: alert.rule.security_severity_level, message: alert.most_recent_instance?.message?.text, path: alert.most_recent_instance?.location?.path, start_line: alert.most_recent_instance?.location?.start_line, html_url: alert.html_url })), null, 2));
