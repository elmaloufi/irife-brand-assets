# GitHub CodeQL scans the repository's workflow and TypeScript/JavaScript code.
name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "45 2 * * 1"

permissions:
  contents: read
  security-events: write
  checks: read
  packages: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ["actions", "javascript-typescript"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

      - name: Inspect open CodeQL alerts for this pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: checkData } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
              per_page: 100,
            });
            const codeql = checkData.check_runs.find((run) => run.name === 'CodeQL');
            if (!codeql) {
              core.warning('No CodeQL summary check run was found for this commit.');
              return;
            }
            const { data: annotations } = await github.rest.checks.listAnnotations({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: codeql.id,
              per_page: 100,
            });
            core.info(JSON.stringify(annotations.map((annotation) => ({
              path: annotation.path,
              start_line: annotation.start_line,
              end_line: annotation.end_line,
              level: annotation.annotation_level,
              message: annotation.message,
              title: annotation.title,
              raw_details: annotation.raw_details,
            })), null, 2));
