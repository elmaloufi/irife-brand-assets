name: IRIFE Docker Compose CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'security/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: irife-docker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-compose:
    name: Validate Docker Compose and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start PostgreSQL and wait for health
        run: docker compose up -d --wait --wait-timeout 60 postgres

      - name: Verify PostgreSQL readiness
        run: docker compose exec -T postgres pg_isready -U irife -d irife

      - name: Stop and remove test containers
        if: always()
        run: docker compose down --volumes --remove-orphans
