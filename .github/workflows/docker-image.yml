name: IRIFE Docker Compose CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'security/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: irife-docker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-compose:
    name: Validate Docker Compose and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Wait for PostgreSQL readiness
        run: |
          for attempt in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U irife -d irife; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps -a
          docker compose logs --no-color postgres
          exit 1

      - name: Show PostgreSQL diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color postgres

      - name: Stop and remove test containers
        if: always()
        run: docker compose down --volumes --remove-orphans
