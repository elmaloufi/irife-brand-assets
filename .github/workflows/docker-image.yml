name: IRIFE Docker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Docker image validation (when Dockerfile exists)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect Dockerfile
        id: dockerfile
        shell: bash
        run: |
          if [ -f Dockerfile ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "A root Dockerfile was found."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker image build skipped: this repository has no root Dockerfile."
          fi

      - name: Set up Docker Buildx
        if: steps.dockerfile.outputs.available == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Validate Dockerfile
        if: steps.dockerfile.outputs.available == 'true'
        run: |
          docker buildx build \
            --check \
            --file Dockerfile \
            .

      - name: Build Docker Image
        if: steps.dockerfile.outputs.available == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: irife:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: CI Summary
        if: always()
        shell: bash
        run: |
          echo "## IRIFE Docker CI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.dockerfile.outputs.available }}" = "true" ]; then
            echo "- Result: Dockerfile validation/build executed; job status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Result: SKIPPED - no root Dockerfile exists in this repository." >> "$GITHUB_STEP_SUMMARY"
          fi
