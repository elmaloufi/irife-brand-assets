name: IRIFE Docker Compose CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'security/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: irife-docker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-compose:
    name: Validate Docker Compose and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Wait for PostgreSQL health
        run: |
          for attempt in $(seq 1 30); do
            state=$(docker inspect --format '{{.State.Status}}' irife-postgres 2>/dev/null || echo missing)
            health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' irife-postgres 2>/dev/null || echo missing)
            echo "Attempt $attempt: container=$state health=$health"
            if [ "$health" = "healthy" ]; then
              docker exec irife-postgres pg_isready -U irife -d irife
              exit 0
            fi
            if [ "$state" != "running" ]; then
              break
            fi
            sleep 2
          done
          docker compose ps -a
          docker compose logs --no-color postgres
          exit 1

      - name: Stop and remove test containers
        if: always()
        run: docker compose down --volumes --remove-orphans
