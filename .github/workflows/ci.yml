name: IRIFE CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'chore/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: irife-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Mobile, contracts, and API quality
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://irife:irife_local_dev_only@127.0.0.1:5432/irife?schema=public

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: irife
          POSTGRES_PASSWORD: irife_local_dev_only
          POSTGRES_DB: irife
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U irife -d irife"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Expo SDK 57 native peer versions
        run: npm ls react-native-reanimated react-native-worklets expo-modules-core --workspace=@irife/mobile

      - name: Verify Expo SDK package compatibility
        run: npm run expo:check --workspace=@irife/mobile

      - name: Export Android JavaScript bundle
        run: npm run mobile:export

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Apply migrations to clean PostgreSQL
        run: npm run db:migrate

      - name: Run mobile, contract, workspace, and API tests
        run: npm test

      - name: Build contracts and API; type-check mobile
        run: npm run build


  android-debug-build:
    name: Android native debug APK
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install locked workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Android native project
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: irife-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
