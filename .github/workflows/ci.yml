name: IRIFE CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'chore/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: irife-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Mobile, contracts, and API quality
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://irife:irife_local_dev_only@127.0.0.1:5432/irife?schema=public

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: irife
          POSTGRES_PASSWORD: irife_local_dev_only
          POSTGRES_DB: irife
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U irife -d irife"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Expo SDK 57 native peer versions
        run: npm ls react-native-reanimated react-native-worklets expo-modules-core --workspace=@irife/mobile

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Apply migrations to clean PostgreSQL
        run: npm run db:migrate

      - name: Run mobile, contract, workspace, and API tests
        run: npm test

      - name: Build contracts and API; type-check mobile
        run: npm run build
