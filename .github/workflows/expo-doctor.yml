name: Expo Doctor

on:
  push:
    branches:
      - main
      - 'security/**'
      - 'chore/**'
  pull_request:
    branches: [main]
  schedule:
    - cron: '45 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expo-doctor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expo:
    name: Expo SDK 57 dependency compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Expo package alignment
        working-directory: apps/mobile
        run: npx expo install --check

      - name: Run Expo Doctor
        working-directory: apps/mobile
        run: npx expo-doctor

      - name: Export Android bundle
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/irife-expo-android"
