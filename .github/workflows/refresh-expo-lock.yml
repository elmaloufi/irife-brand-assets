name: Refresh Expo lockfile

on:
  push:
    branches:
      - feat/irife-expo-foundation-gate1
    paths:
      - apps/mobile/package.json
      - .github/workflows/refresh-expo-lock.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: irife-expo-lock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies from regenerated lockfile
        run: npm ci --no-audit --no-fund

      - name: Verify Expo dependency alignment
        run: npm run expo:check --workspace=@irife/mobile

      - name: Commit generated lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(mobile): synchronize Expo dependency lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Dispatch full CI against synchronized lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"
