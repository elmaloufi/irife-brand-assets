# Appknox mobile security scanning is enabled only when the Android Gradle wrapper
# and APPKNOX_ACCESS_TOKEN are configured in this repository.
name: Appknox

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  appknox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect Android Gradle wrapper
        id: android
        shell: bash
        run: |
          if [ -f gradlew ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Appknox scan skipped: no root gradlew wrapper is present."
          fi

      - name: Grant execute permission for gradlew
        if: steps.android.outputs.available == 'true'
        run: chmod +x gradlew

      - name: Build the Android app
        if: steps.android.outputs.available == 'true'
        run: ./gradlew build

      - name: Appknox GitHub action
        id: appknox
        if: steps.android.outputs.available == 'true' && secrets.APPKNOX_ACCESS_TOKEN != ''
        uses: appknox/appknox-github-action@b7d2bfb2321d5544e97bffcba48557234ab953a4
        with:
          appknox_access_token: ${{ secrets.APPKNOX_ACCESS_TOKEN }}
          file_path: app/build/outputs/apk/debug/app-debug.apk
          risk_threshold: MEDIUM
          sarif: Enable

      - name: Upload SARIF to GHAS
        if: always() && steps.appknox.outcome == 'success' && hashFiles('report.sarif') != ''
        uses: github/codeql-action/upload-sarif@5eb3ed6614230b1931d5c08df9e096e4ba524f21 # v3.28.17
        with:
          sarif_file: report.sarif
          wait-for-processing: true

      - name: Appknox status summary
        if: always()
        shell: bash
        run: |
          echo "## Appknox mobile security scan" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.android.outputs.available }}" != "true" ]; then
            echo "- Result: SKIPPED - no root Gradle wrapper is present." >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "${{ secrets.APPKNOX_ACCESS_TOKEN }}" ]; then
            echo "- Result: SKIPPED - APPKNOX_ACCESS_TOKEN is not configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Result: Android build and Appknox scan were attempted; inspect step results above." >> "$GITHUB_STEP_SUMMARY"
          fi
