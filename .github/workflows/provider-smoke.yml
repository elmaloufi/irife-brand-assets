name: Provider live smoke tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-providers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe Open-Meteo and Nominatim
        run: node services/api/scripts/provider-smoke.mjs
