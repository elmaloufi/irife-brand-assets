# Runs Datadog Synthetic tests when both repository secrets are configured.
# Required secrets: DD_API_KEY and DD_APP_KEY.
name: Run Datadog Synthetic tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  synthetics:
    name: Datadog Synthetic tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check Datadog credentials
        id: datadog_credentials
        if: secrets.DD_API_KEY != '' && secrets.DD_APP_KEY != ''
        run: echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Run Datadog Synthetic tests
        if: steps.datadog_credentials.outputs.configured == 'true'
        uses: DataDog/synthetics-ci-github-action@87b505388a22005bb8013481e3f73a367b9a53eb # v1.4.0
        with:
          api_key: ${{ secrets.DD_API_KEY }}
          app_key: ${{ secrets.DD_APP_KEY }}
          test_search_query: 'tag:e2e-tests'

      - name: Datadog status summary
        if: always()
        shell: bash
        run: |
          echo "## Datadog Synthetic tests" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.datadog_credentials.outputs.configured }}" = "true" ]; then
            echo "- Result: Datadog tests were invoked; inspect the action result above." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Result: SKIPPED - configure DD_API_KEY and DD_APP_KEY to enable this integration." >> "$GITHUB_STEP_SUMMARY"
          fi
