name: IRIFE CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: irife-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Mobile, contracts, and API quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: Upload generated npm lockfile
        uses: actions/upload-artifact@v7
        with:
          name: irife-npm-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Run mobile, contract, workspace, and API tests
        run: npm test

      - name: Build contracts and API; type-check mobile
        run: npm run build
