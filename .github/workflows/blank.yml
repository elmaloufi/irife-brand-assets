name: IRIFE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: irife-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-quality:
    name: Mobile TypeScript Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: Run mobile TypeScript check
        run: npm run build
