name: API security

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'security/**'
  pull_request:
    branches: [main]
  schedule:
    - cron: '35 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Audit Node.js dependency tree
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Fail on high or critical known vulnerabilities
        run: npm audit --audit-level=high

      - name: Validate API Prisma schema
        run: npm run db:validate
